# Render.com deployment configuration for VisionIQ backend
services:
  - type: web
    name: visioniq-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: VISIONIQ_ENV
        value: production
      - key: VISIONIQ_SECRET_KEY
        generateValue: true
    autoDeploy: true
